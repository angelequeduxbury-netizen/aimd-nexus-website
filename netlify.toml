[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/audit"
  to = "/.netlify/functions/audit"
  status = 200
  force = true

# Added: publish = "." serves the whole project folder, so block files that are not part of the website.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
